<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
  <title id="title">Mihomo Route Sentinel 已交付演进与建议迭代</title>
  <desc id="desc">上方为已交付的v1.3选择质量、v1.4恢复时效、v1.5出口一致、v1.6快速恢复、v1.7负载可观测。下方为待Bear裁定的建议：A可靠性证据、B目标平台、C版本发布；不承诺顺序、版本号或日期。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
    <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172b4d}.title{font-size:34px;font-weight:700}.heading{font-size:27px;font-weight:700}.body{font-size:23px}.small{font-size:22px;fill:#52637b}.blue{fill:#2563eb}.teal{fill:#087e74}.orange{fill:#9a570c}</style>
  </defs>
  <rect width="1120" height="800" rx="24" fill="#f8fafc"/>
  <text x="48" y="62" class="title">先解决“选得对”，再回答“恢复得怎样”</text>
  <text x="48" y="104" class="body">已实现的能力，与尚未批准的计划分开阅读。</text>
  <rect x="48" y="145" width="139" height="42" rx="21" fill="#eaf8f5"/>
  <text x="117" y="174" text-anchor="middle" class="body teal">已交付</text>
  <path d="M126 242H987" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <g fill="#2563eb"><circle cx="146" cy="242" r="9"/><circle cx="353" cy="242" r="9"/><circle cx="560" cy="242" r="9"/><circle cx="767" cy="242" r="9"/><circle cx="974" cy="242" r="9"/></g>
  <g text-anchor="middle">
    <text x="146" y="220" class="heading blue">v1.3</text><text x="353" y="220" class="heading blue">v1.4</text><text x="560" y="220" class="heading blue">v1.5</text><text x="767" y="220" class="heading blue">v1.6</text><text x="974" y="220" class="heading blue">v1.7</text>
    <text x="146" y="291" class="heading">选择质量</text><text x="353" y="291" class="heading">恢复时效</text><text x="560" y="291" class="heading">出口一致</text><text x="767" y="291" class="heading">快速恢复</text><text x="974" y="291" class="heading">负载可观测</text>
    <text x="146" y="332" class="small">滚动退化</text><text x="146" y="364" class="small">严格与临时候选</text>
    <text x="353" y="332" class="small">后台有界扫描</text><text x="353" y="364" class="small">正确计算选择次数</text>
    <text x="560" y="332" class="small">固定可选叶子</text><text x="560" y="364" class="small">重新严格准入</text>
    <text x="767" y="332" class="small">快照与并行复核</text><text x="767" y="364" class="small">标记应急身份</text>
    <text x="974" y="332" class="small">控制探测负载</text><text x="974" y="364" class="small">请求量可解释</text>
  </g>
  <path d="M48 408H1072" stroke="#dce3ec" stroke-width="2"/>
  <rect x="48" y="440" width="260" height="42" rx="21" fill="#fff1df"/>
  <text x="178" y="469" text-anchor="middle" class="body orange">建议 · 待 Bear 裁定</text>
  <rect x="48" y="515" width="320" height="188" rx="17" fill="#fff" stroke="#dce3ec" stroke-width="2"/>
  <rect x="400" y="515" width="320" height="188" rx="17" fill="#fff" stroke="#dce3ec" stroke-width="2"/>
  <rect x="752" y="515" width="320" height="188" rx="17" fill="#fff" stroke="#dce3ec" stroke-width="2"/>
  <text x="72" y="556" class="heading blue">A · 可靠性证据</text><text x="72" y="599" class="body">先定义恢复事件口径</text><text x="72" y="636" class="body">再汇总真实故障样本</text><text x="72" y="677" class="small">结果：可评审的分布与失败</text>
  <text x="424" y="556" class="heading blue">B · 目标平台</text><text x="424" y="599" class="body">选定 Linux 或 macOS</text><text x="424" y="636" class="body">完成生命周期实机验证</text><text x="424" y="677" class="small">结果：安装启停可重复</text>
  <text x="776" y="556" class="heading blue">C · 版本发布</text><text x="776" y="599" class="body">明确已验证的发布范围</text><text x="776" y="636" class="body">补齐说明与回滚入口</text><text x="776" y="677" class="small">结果：新用户有可信入口</text>
  <text x="560" y="755" text-anchor="middle" class="body orange">字母不是优先级：未承诺顺序、下一版本号或交付日期。</text>
</svg>
